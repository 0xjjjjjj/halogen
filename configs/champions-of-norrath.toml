# PS2Recomp config for Champions of Norrath (NTSC-U)
# Serial: SLUS-20565
# ELF: SLUS_205.65

[general]
input = "bin/SLUS_205.65"
output = "output/champions-of-norrath/"
single_file_output = false

# Standard PS2 libc stubs
stubs = [
    "printf",
    "sprintf",
    "snprintf",
    "malloc",
    "free",
    "calloc",
    "realloc",
    "memcpy",
    "memmove",
    "memset",
    "memcmp",
    "strlen",
    "strcmp",
    "strncmp",
    "strcpy",
    "strncpy",
    "strcat",
]

# Functions to skip
skip = ["abort", "exit", "_exit"]

[patches]
instructions = []
